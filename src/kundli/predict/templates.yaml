en:
  disclaimer: "This is a traditional Jyotish interpretation, not a certainty or scientific prediction. For health, legal or financial matters please consult a qualified professional."
  house_theme: {1: "self, body and personality", 2: "wealth, speech and family", 3: "effort, courage and communication", 4: "home, mother and inner comfort", 5: "intellect, creativity and children", 6: "service, competition and health challenges", 7: "marriage and partnerships", 8: "transformation, research and sudden change", 9: "fortune, dharma and higher learning", 10: "career, status and public life", 11: "gains, networks and fulfilment of desires", 12: "expenses, foreign lands and solitude"}
  placement: {good: "in a supportive house (kendra or trikona), which helps results", hard: "in a dusthana (6th, 8th or 12th), so results come with effort or delay", mid: "in a neutral house, giving moderate results"}
  house_line: "The {h} house ({theme}) is {sign}, ruled by {lord}, which sits {placement}."
  dignity: {strong: "{planet} is {dignity}, a strengthening condition.", weak: "{planet} is debilitated, a weakening condition that may need conscious effort.", plain: "{planet} has {dignity} dignity."}
  dasha_line: "The running {level} dasha is {lord} ({start} to {end}); {lord} rules or occupies houses connected to this topic: {rel}."
  dasha_neutral: "The running {level} dasha is {lord} ({start} to {end}); it has no direct tie to the houses of this topic, so the effect is indirect."
  window_line: "Timeline: a {kind} window is indicated from {start} to {end}."
  yoga_line: "{name}: {effect}"
  yoga_cancelled: "{name} is present but reduced by {cancel}."
  summary: "For {topics}, the chart points to the following (traditional reading):"
  no_facts: "The engine has no facts relevant to this question."
  yoga_effect:
    gajakesari: "traditionally gives good reputation, intelligence and support from others"
    budhaditya: "traditionally gives sharp intellect and skill in communication"
    chandra_mangala: "traditionally gives drive toward earning and enterprise"
    adhi_yoga: "traditionally gives leadership and comfort through supportive people"
    amala: "traditionally gives lasting good reputation through ethical work"
    sunapha: "traditionally gives self-earned wealth and intelligence"
    anapha: "traditionally gives good health, dignity and a pleasant nature"
    durudhura: "traditionally gives comforts and generosity"
    kemadruma: "traditionally indicates periods of emotional isolation or financial ups and downs"
    parivartana: "an exchange of signs that strongly links the two houses involved"
    raja_yoga: "traditionally gives rise in status when the related dashas run"
    yogakaraka: "a planet ruling both a kendra and a trikona, traditionally very supportive"
    dhana_yoga: "traditionally supports accumulation of wealth in related dashas"
    viparita_raja: "traditionally turns difficulties into eventual gains"
    neecha_bhanga: "traditionally cancels the weakness of a debilitated planet and can give a rise after struggle"
    ruchaka: "a Mahapurusha yoga of Mars: courage, leadership and drive"
    bhadra: "a Mahapurusha yoga of Mercury: intellect and business skill"
    hamsa: "a Mahapurusha yoga of Jupiter: wisdom, ethics and respect"
    malavya: "a Mahapurusha yoga of Venus: comforts, refinement and relationships"
    sasa: "a Mahapurusha yoga of Saturn: discipline, authority and endurance"
    kaal_sarpa: "traditionally indicates concentrated karmic themes and delays before results"
    mangal_dosha: "traditionally considered in marriage matching; check cancellations and the partner's chart"
    pitru_dosha: "traditional indicator linked with ancestral themes; interpretation varies by school"
    guru_chandala: "traditionally suggests unconventional thinking and a need to ground wisdom in ethics"
    grahan: "traditionally indicates a stressed luminary and a need for emotional or self-confidence work"
    shakata: "traditionally indicates fluctuations of fortune that stabilise with effort"
    daridra: "traditionally indicates gains that require persistent effort"
hi:
  disclaimer: "यह पारंपरिक ज्योतिष व्याख्या है, निश्चितता या वैज्ञानिक भविष्यवाणी नहीं। स्वास्थ्य, कानूनी या वित्तीय मामलों में योग्य विशेषज्ञ से सलाह लें।"
  house_theme: {1: "स्वयं, शरीर और व्यक्तित्व", 2: "धन, वाणी और परिवार", 3: "पराक्रम और संवाद", 4: "घर, माता और सुख", 5: "बुद्धि, सृजन और संतान", 6: "सेवा, प्रतिस्पर्धा और स्वास्थ्य चुनौतियाँ", 7: "विवाह और साझेदारी", 8: "परिवर्तन और अचानक बदलाव", 9: "भाग्य, धर्म और उच्च शिक्षा", 10: "करियर, पद और प्रतिष्ठा", 11: "लाभ और इच्छापूर्ति", 12: "खर्च, विदेश और एकांत"}
  placement: {good: "सहायक भाव (केंद्र/त्रिकोण) में है, जिससे फल अच्छे रहते हैं", hard: "दुस्थान (6/8/12) में है, इसलिए फल प्रयास से या देर से मिलते हैं", mid: "सामान्य भाव में है, मध्यम फल देता है"}
  house_line: "{h} भाव ({theme}) {sign} राशि का है, स्वामी {lord} है, जो {placement}।"
  dignity: {strong: "{planet} {dignity} अवस्था में है, यह बल देता है।", weak: "{planet} नीच अवस्था में है, यह कमज़ोरी है जिसमें प्रयास ज़रूरी हो सकता है।", plain: "{planet} की अवस्था {dignity} है।"}
  dasha_line: "चल रही {level} दशा {lord} की है ({start} से {end}); {lord} इस विषय के भावों से जुड़ा है: {rel}।"
  dasha_neutral: "चल रही {level} दशा {lord} की है ({start} से {end}); इसका इस विषय से सीधा संबंध नहीं, इसलिए प्रभाव परोक्ष है।"
  window_line: "समयरेखा: {start} से {end} तक {kind} अवधि संकेतित है।"
  yoga_line: "{name}: {effect}"
  yoga_cancelled: "{name} मौजूद है पर {cancel} से कम होता है।"
  summary: "{topics} के लिए कुंडली यह संकेत देती है (पारंपरिक व्याख्या):"
  no_facts: "इस प्रश्न के लिए इंजन के पास प्रासंगिक तथ्य नहीं हैं।"
  yoga_effect:
    gajakesari: "परंपरा से यश, बुद्धि और लोगों का सहयोग देता है"
    budhaditya: "परंपरा से तेज बुद्धि और वाणी कौशल देता है"
    chandra_mangala: "परंपरा से कमाई और उद्यम की प्रेरणा देता है"
    adhi_yoga: "परंपरा से नेतृत्व और सुख देता है"
    amala: "परंपरा से नैतिक कार्य से स्थायी यश देता है"
    sunapha: "परंपरा से स्वअर्जित धन देता है"
    anapha: "परंपरा से अच्छा स्वास्थ्य और प्रतिष्ठा देता है"
    durudhura: "परंपरा से सुख-सुविधा देता है"
    kemadruma: "परंपरा से भावनात्मक अकेलापन या आर्थिक उतार-चढ़ाव का संकेत"
    parivartana: "राशि अदला-बदली, दो भावों को मजबूती से जोड़ती है"
    raja_yoga: "परंपरा से संबंधित दशाओं में पद वृद्धि देता है"
    yogakaraka: "केंद्र और त्रिकोण का स्वामी, परंपरा से अत्यंत सहायक"
    dhana_yoga: "परंपरा से धन संचय में सहायक"
    viparita_raja: "परंपरा से कठिनाइयों को अंततः लाभ में बदलता है"
    neecha_bhanga: "परंपरा से नीच ग्रह की कमज़ोरी का भंग होता है"
    ruchaka: "मंगल का महापुरुष योग: साहस और नेतृत्व"
    bhadra: "बुध का महापुरुष योग: बुद्धि और व्यापार कौशल"
    hamsa: "गुरु का महापुरुष योग: ज्ञान और सम्मान"
    malavya: "शुक्र का महापुरुष योग: सुख और संबंध"
    sasa: "शनि का महापुरुष योग: अनुशासन और अधिकार"
    kaal_sarpa: "परंपरा से कर्मिक विषयों और फल में देरी का संकेत"
    mangal_dosha: "विवाह मिलान में परंपरा से देखा जाता है; परिहार और जानकारी जाँचें"
    pitru_dosha: "पैतृक विषयों से जुड़ा पारंपरिक संकेत; मत भिन्न हैं"
    guru_chandala: "परंपरा से अपरंपरागत सोच का संकेत"
    grahan: "परंपरा से पीड़ित प्रकाशक ग्रह का संकेत"
    shakata: "परंपरा से भाग्य में उतार-चढ़ाव, प्रयास से स्थिरता"
    daridra: "परंपरा से लाभ के लिए निरंतर प्रयास का संकेत"
