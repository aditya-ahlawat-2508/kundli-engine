- {id: guru_purnima, name: Guru Purnima, kind: lunar, month: Ashadha, tithi: 15, anchor: sunrise}
- {id: raksha_bandhan, name: Raksha Bandhan, kind: lunar, month: Shravana, tithi: 15, anchor: sunrise}
- {id: janmashtami, name: Krishna Janmashtami, kind: lunar, month: Shravana, tithi: 23, anchor: nishita}
- {id: ganesh_chaturthi, name: Ganesh Chaturthi, kind: lunar, month: Bhadrapada, tithi: 4, anchor: madhyahna}
