# Festival rules. Months are AMANTA names (as returned by panchang.hindu_month); tithi is 1..30 (16..30 = krishna
# paksha, 30 = amavasya). anchor = the moment of the civil day at which the tithi must be running:
#   sunrise | madhyahna (midday) | aparahna (0.7 of the day) | pradosha (sunset + 2 ghati) | nishita (midnight of the
#   night after the day) | moonrise
# kind: lunar (month + tithi), tithi (every month), sankranti (solar ingress), after (the civil day after another rule).
# All rules are simplified single-anchor rules: when a tithi touches two civil days at the anchor, or neither, the
# classical tie-breaks are NOT applied (docs/open_questions.md). verify=true until checked against Drik Panchang.
- {id: maha_shivaratri, name: Maha Shivaratri, kind: lunar, month: Magha, tithi: 29, anchor: nishita}
- {id: holika_dahan, name: Holika Dahan, kind: lunar, month: Phalguna, tithi: 15, anchor: pradosha}
- {id: holi, name: Holi, kind: after, after: holika_dahan}
- {id: ugadi, name: Ugadi / Gudi Padwa, kind: lunar, month: Chaitra, tithi: 1, anchor: sunrise}
- {id: rama_navami, name: Rama Navami, kind: lunar, month: Chaitra, tithi: 9, anchor: madhyahna}
- {id: hanuman_jayanti, name: Hanuman Jayanti, kind: lunar, month: Chaitra, tithi: 15, anchor: sunrise}
