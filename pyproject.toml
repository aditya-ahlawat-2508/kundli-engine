[project]
name = "kundli-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya_Ahlawat", email = "adityaahlawat544@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pyswisseph>=2.10.3.2",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "svglib>=2.3.0",
    "timezonefinder>=9.0.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kundli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["B008", "RUF007", "ISC004", "PLC0206", "RUF059", "E501", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[project.scripts]
kundli = "kundli.cli:app"
