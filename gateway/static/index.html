/* Layout: saffron-and-ink consumer site; light cream bands alternate with white, one dark band for reviews; overlays for checkout, wallet, chat and call */

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
*{box-sizing:border-box}

body{background:var(--page)}
.util{background:var(--saffron);color:#1A1208}
.util .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding-block:7px}
.util-links{display:flex;flex-wrap:wrap;gap:4px 0;font-size:13px}
.util-links a{color:#1A1208;text-decoration:none;padding:4px 10px;border-right:1px solid rgba(26,18,8,.25)}
.util-links a:last-child{border-right:0}
.util-links a:hover{text-decoration:underline}
.util-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;background:#FFFFFF;color:#1A1208;border:0;border-radius:10px;padding:7px 12px;min-height:38px;font-weight:600;font-size:13.5px;cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.pill .live{width:8px;height:8px;border-radius:50%;background:#1F8A4C;display:inline-block;box-shadow:0 0 0 3px rgba(31,138,76,.2)}
.util .langs{border-color:rgba(26,18,8,.25);background:rgba(255,255,255,.55)}
.util .langs button{color:#1A1208}
.util .langs button[aria-pressed="true"]{background:#1A1208;color:#FFFFFF}
.brandbar{background:var(--bg);border-bottom:1px solid var(--line)}
.brandbar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-block:12px}
.zodiac{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:1 1 520px;max-width:640px}
.zodiac button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);padding:7px 4px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg)}
.zodiac button:nth-child(6n){border-right:0}
.zodiac button:nth-child(n+7){border-bottom:0}
.zodiac button:hover,.zodiac button[aria-pressed="true"]{background:var(--band);color:var(--accent-ink)}
.zsym{font-family:"Noto Sans Symbols","Segoe UI Symbol",sans-serif;font-size:16px;color:var(--accent-ink);line-height:1}
.brand-cta{border-radius:999px;min-height:46px}
.mainnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);border-bottom:1px solid var(--line)}
.mainnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mainnav .wrap::-webkit-scrollbar{display:none}
.mainnav a{flex:none;color:var(--fg);text-decoration:none;font-size:14.5px;font-weight:500;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.mainnav a:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}

.hero2{padding-top:20px;background:var(--page)}
.hero-banner{background:var(--night);color:var(--night-fg);border-radius:22px;padding:30px;display:grid;grid-template-columns:minmax(0,170px) minmax(0,250px) minmax(0,1fr);gap:32px;align-items:center;position:relative;overflow:hidden}
.hero-banner::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(245,178,107,.18);box-shadow:0 0 0 40px rgba(245,178,107,.04),0 0 0 90px rgba(245,178,107,.03);pointer-events:none}
.hb-stats{display:flex;flex-direction:column;gap:18px;text-align:center}
.hb-stats div{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;border-bottom:1px solid #3A312A}
.hb-stats div:last-child{border-bottom:0;padding-bottom:0}
.hb-stats b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#FFFFFF}
.hb-stats span{font-size:13px;color:var(--night-muted)}
.phone{background:#0B0908;border:6px solid #2C2420;border-radius:34px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;min-height:420px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative;z-index:1}
.phone-notch{width:90px;height:18px;border-radius:0 0 12px 12px;background:#2C2420;margin:-10px auto 4px}
.phone-head{display:flex;align-items:center;gap:8px;background:var(--saffron);color:#1A1208;border-radius:14px;padding:8px 10px}
.phone-head span:last-child{display:flex;flex-direction:column;line-height:1.2}
.phone-head small{font-size:11px}
.avatar.sm{width:30px;height:30px;font-size:14px;background:#1A1208;color:#F5B26B}
.phone-body{display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.pb{font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:12px;max-width:88%}
.pb.u{align-self:flex-end;background:#F5B26B;color:#1A1208;border-top-right-radius:3px}
.pb.s{align-self:flex-start;background:#241E19;color:#F3EDE6;border-top-left-radius:3px}
.typing-dots{display:flex;gap:4px}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:#BDB2A6;animation:blink 1.2s infinite}
.typing-dots i:nth-child(2){animation-delay:.2s}.typing-dots i:nth-child(3){animation-delay:.4s}
.hb-copy{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;min-width:0}
.badge-dark{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.4px;color:#F5B26B;border:1px solid #4A3E34;border-radius:999px;padding:6px 12px}
.hb-copy h1{font-size:clamp(30px,3.6vw,46px);line-height:1.12;font-weight:800;letter-spacing:-.5px;color:#FFFFFF}
.hb-copy h1 em{font-style:normal;color:#F5B26B;display:block}
.hb-sub{color:#D7CDC2;font-size:16px;line-height:1.6;max-width:58ch}
.hb-feats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;font-size:14px;color:#F3EDE6}
.hb-feats li{display:flex;gap:8px;align-items:center}
.hb-feats .tick{color:#F5B26B}
.hb-actions{display:flex;flex-wrap:wrap;gap:10px}
.hb-actions .btn{border-radius:999px}
.btn-outline-light{background:transparent;border:1.5px solid #F5B26B;color:#F5B26B}
.hero2 .ticker{background:var(--page);border-top:0}

.section-tight{padding-block:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;padding:14px 20px;background:var(--panel-head);border-bottom:1px solid var(--line)}
.panel-head h2{font-size:20px;font-weight:700;color:var(--accent-ink)}
.astros{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0}
.astro{display:flex;gap:16px;align-items:center;padding:18px 20px;border-right:1px solid var(--line)}
.astro:last-child{border-right:0}
.astro .ava{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1A1208;background:radial-gradient(circle at 30% 30%,#FFD8A8,#F28C1E);position:relative}
.astro .ava::after{content:"";position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:50%;background:#1F8A4C;border:2px solid var(--card)}
.astro .info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.astro .info b{font-size:17px}
.astro .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.astro .acts{display:flex;flex-direction:column;gap:8px;flex:none}
.astro .acts .btn{min-height:42px;padding:9px 16px;border-radius:999px;font-size:14px}

.tools3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;align-items:start}
.tool-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.tool .kform{gap:13px}
.mgroup{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.mgroup legend{font-weight:700;font-size:14px;padding:0 6px;color:var(--accent-ink)}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv dt,.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.tag-demo{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.6px;background:var(--band);color:var(--accent-ink);border:1px dashed var(--accent);border-radius:999px;padding:3px 9px}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:40px;font-weight:800;letter-spacing:-1px;color:var(--accent-ink)}
.bar{height:8px;border-radius:999px;background:var(--band);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr))}
.svc-grid .svc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;flex-direction:row;align-items:center;gap:12px;padding:16px 18px;background:var(--card);min-height:72px}
.svc-grid .svc:hover{background:var(--band)}
.svc-grid .svc b{font-size:14.5px;line-height:1.3}
.svc-grid .svc .muted{display:none}
.svc-ico{width:42px;height:42px;border-radius:12px;background:var(--band);display:flex;align-items:center;justify-content:center;flex:none}

.two-col{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:var(--card);padding:12px 16px;min-height:46px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);background:var(--band)}
.signs-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-bottom:1px solid var(--line)}
.signs-strip .sign{border:0;border-right:1px solid var(--line);border-radius:0;background:var(--card);padding:10px 2px;align-items:center;text-align:center;gap:4px;min-height:64px}
.signs-strip .sign:last-child{border-right:0}
.signs-strip .sign .zsym{font-size:24px}
.signs-strip .sign b{font-size:11.5px;font-weight:600}
.signs-strip .sign span{display:none}
.signs-strip .sign[aria-pressed="true"]{background:var(--band);color:var(--accent-ink)}
.signs-strip .sign[aria-pressed="true"] .zsym{color:var(--accent-ink)}
.ras-panel{padding:20px}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list button{width:100%;text-align:left;border:0;background:var(--card);padding:13px 20px;min-height:46px;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--fg)}
.list button:hover{background:var(--band);color:var(--accent-ink)}
.list small{color:var(--muted);flex:none}
.foot-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:22px}
.foot-cols b{color:#FFFFFF;display:block;margin-bottom:10px}
.foot-cols a{display:block;color:var(--night-muted);text-decoration:none;font-size:13.5px;padding-block:4px}
.foot-cols a:hover{color:#F5B26B}

@media (max-width:980px){
  .hero-banner{grid-template-columns:minmax(0,1fr);padding:24px}
  .hb-stats{flex-direction:row;flex-wrap:wrap;justify-content:space-around;order:3}
  .hb-stats div{border-bottom:0;padding-bottom:0}
  .phone{display:none}
  .two-col{grid-template-columns:minmax(0,1fr)}
  .signs-strip{grid-template-columns:repeat(6,minmax(0,1fr))}
  .signs-strip .sign:nth-child(6n){border-right:0}
  .signs-strip .sign:nth-child(-n+6){border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .zodiac{grid-template-columns:repeat(4,minmax(0,1fr))}
  .zodiac button:nth-child(6n){border-right:1px solid var(--line)}
  .zodiac button:nth-child(4n){border-right:0}
  .zodiac button:nth-child(n+7){border-bottom:1px solid var(--line)}
  .zodiac button:nth-child(n+9){border-bottom:0}
  .zodiac button .zname{display:none}
  .hb-feats{grid-template-columns:minmax(0,1fr)}
  .astro{flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  .astro .acts{flex-direction:row;width:100%}
  .astro .acts .btn{flex:1}
  .brand-cta{display:none}
}

/* ---- responsive pass: phones, tablets, laptops, large screens ---- */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
.signs-strip .sign span:not(.zsym){display:none}
.astro{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px 16px}
.astro .acts{grid-column:1/-1;flex-direction:row}
.astro .acts .btn{flex:1}
.sheet{max-height:92vh;max-height:92dvh}
@media (max-width:1099px){
  .brand-cta{display:none}
  .zodiac{max-width:none;flex:1 1 100%}
}
@media (min-width:701px) and (max-width:1099px){
  .tools3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools3>.tool:last-child{grid-column:1/-1}
  .svc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tools3>.tool:last-child .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
}
@media (max-width:700px){
  .util .wrap{flex-direction:column;align-items:stretch;gap:6px;padding-block:6px}
  .util-links{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
  .util-links::-webkit-scrollbar{display:none}
  .util-links a{flex:none;white-space:nowrap}
  .util-links,.util-right,.zodiac{min-width:0;width:100%;max-width:100%}
  .util-right{flex-wrap:wrap;gap:6px}
  .util .langs{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .util-right .pill{flex:1 1 0;min-width:0;justify-content:center;padding-inline:10px;min-height:40px}
  .util .langs button{padding:6px 8px;font-size:12px;min-height:34px}
  .brandbar .wrap{gap:10px;padding-block:10px}
  .zodiac{display:flex;overflow-x:auto;scrollbar-width:none;border-radius:12px}
  .zodiac::-webkit-scrollbar{display:none}
  .zodiac button,.zodiac button:nth-child(n){flex:none;flex-direction:column;gap:2px;min-width:68px;border-right:1px solid var(--line);border-bottom:0;padding:8px 6px}
  .zodiac button:last-child{border-right:0}
  .zodiac button .zname{display:block;font-size:11px}
  .hero2{padding-top:12px}
  .hero-banner{padding:20px;border-radius:18px;gap:20px}
  .hb-copy h1{font-size:30px}
  .hb-actions .btn{flex:1 1 140px}
  .hb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .hb-stats b{font-size:22px}
  .hb-stats span{font-size:11.5px}
  .svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svc-grid .svc{flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:96px}
  .svc-grid .svc b{font-size:13.5px}
  .panel-head{padding:12px 16px}
  .tool-body{padding:16px}
  .section{padding-block:48px}
  .h2{font-size:26px}
  .row>*{flex:1 1 130px}
  input,select,textarea,.compose input{font-size:16px!important}
  .chat-sheet{height:100vh;height:100dvh;max-height:100dvh;border-radius:0}
  .scrim{padding:0}
  .drawer{max-width:none}
  .msg{max-width:92%}
  .call-actions{gap:40px}
  .list button{padding:12px 16px}
}
@media (max-width:380px){
  .util .langs button{padding:6px 6px;font-size:11.5px}
  .hb-stats b{font-size:24px}
}
@media (min-width:1600px){
  .wrap{max-width:1320px}
}

/* plans */
.plans-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.plan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.plan{display:flex;flex-direction:column;gap:6px;padding:18px;border-right:1px solid var(--line);position:relative}
.plan:last-child{border-right:0}
.plan.hot{background:var(--band)}
.plan .ribbon{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.5px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 8px}
.plan strong{font-size:30px;font-weight:800;letter-spacing:-.5px}
.plan .mins{font-weight:700;font-size:15px}
.plan .per{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .use{font-size:13px;color:var(--muted);flex:1 1 auto}
.plan .btn{min-height:42px;padding:9px 12px;font-size:14px;border-radius:12px;margin-top:6px}
.plan-card{display:flex;flex-direction:column;gap:4px}
.plan-card strong{font-size:34px;font-weight:800}
.plan-card .btn{margin-top:8px}
.report-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.report{display:flex;flex-direction:column;gap:10px;padding:22px;border-right:1px solid var(--line);position:relative}
.report:last-child{border-right:0}
.report.hot{background:var(--band)}
.report h3{font-size:18px}
.report strong{font-size:34px;font-weight:800;letter-spacing:-.5px}
.report ul{flex:1 1 auto}
.report .ribbon{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;letter-spacing:.5px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 8px}
.plan-chips{display:flex;flex-wrap:wrap;gap:8px}
.plan-chips .chip{display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;padding:8px 12px}
.plan-chips .chip small{font-weight:500;opacity:.8}
@media (max-width:1099px){.plans-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.report-grid{grid-template-columns:minmax(0,1fr)}.report{border-right:0;border-bottom:1px solid var(--line)}.report:last-child{border-bottom:0}}
@media (max-width:700px){.plan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.plan:nth-child(2n){border-right:0}.plan:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* hero with Shreya photo */
.hero-banner{grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:36px;align-items:stretch}
.hb-copy{justify-content:center}
.hb-stats{flex-direction:row;flex-wrap:wrap;text-align:left;gap:12px 28px;padding-top:16px;border-top:1px solid #3A312A}
.hb-stats div{border-bottom:0;padding-bottom:0}
.hb-stats b{font-size:24px;white-space:nowrap}
.hb-visual{position:relative;border-radius:20px;overflow:hidden;min-height:420px;background:#2A2140;z-index:1}
.hb-visual img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;position:absolute;inset:0}
.hb-visual::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(12,10,8,.85),rgba(12,10,8,0));pointer-events:none}
.ai-tag{position:absolute;top:14px;left:14px;z-index:2;display:inline-flex;align-items:center;gap:7px;background:rgba(12,10,8,.72);color:#FFFFFF;font-size:12px;font-weight:600;border-radius:999px;padding:6px 11px}
.ai-tag .live{width:8px;height:8px;border-radius:50%;background:#2BB36A;display:inline-block}
.float{position:absolute;z-index:2;font-size:12.5px;line-height:1.45;border-radius:14px;padding:9px 12px;max-width:78%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.float.q{right:14px;bottom:118px;background:#F5B26B;color:#1A1208;border-top-right-radius:4px}
.float.a{left:14px;bottom:16px;background:#FFFFFF;color:#1A1714;border-top-left-radius:4px;display:flex;flex-direction:column;gap:2px}
.float.a b{font-size:11.5px;color:#B45309}
.ava img,.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.astro .ava.photo{background:none;padding:0}
.avatar.photo{background:none;padding:0;overflow:hidden}
@media (max-width:980px){
  .hero-banner{grid-template-columns:minmax(0,1fr)}
  .hb-visual{order:-1;min-height:340px}
  .hb-stats{order:0}
}
@media (max-width:700px){
  .hb-visual{min-height:300px;border-radius:16px}
  .float.q{bottom:104px}
  .hb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .hb-stats b{font-size:19px}
}

/* all-plans strip under the astrologers */
.call-avatar{overflow:hidden}.call-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.aplans{border-top:1px solid var(--line);padding:14px 0 16px;display:flex;flex-direction:column;gap:10px}
.aplans-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline:20px}
.small-arrows{display:flex;gap:8px}
.small-arrows button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.aplans-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:12px 20px 8px;scroll-padding-inline:20px;scrollbar-width:thin}
.ap{flex:0 0 200px;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card);position:relative}
.ap.hot{border:2px solid var(--accent)}
.ap .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.ap .who img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.ap .who i{width:26px;height:26px;border-radius:50%;background:var(--band);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--accent-ink);font-family:"Noto Sans Symbols",sans-serif}
.ap b.name{font-size:15px}
.ap strong{font-size:26px;font-weight:800;letter-spacing:-.5px}
.ap .per{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ap .btn{margin-top:auto;min-height:40px;padding:8px 12px;font-size:13.5px;border-radius:999px}
.ap .rib{position:absolute;top:-10px;right:12px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
@media (max-width:700px){.ap{flex-basis:170px}.aplans-head,.aplans-track{padding-inline:16px}}

.wa-btn{background:#25D366;color:#fff;border:0;display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;min-height:44px;padding:10px 18px;border-radius:999px}
.wa-btn:hover{background:#1ebe5a}
</style>

var chatTimer=null;
function stopChatTimer(){if(chatTimer){clearInterval(chatTimer);chatTimer=null;}}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function startChat(mins){
  mins=mins||30; track("chat_started");
  var t=T("topics")[S.topic];
  var q=S.qIndex>=0?fill(T("openerQ"),{q:T("questions")[S.qIndex][0]}):"";

  openLayer("chat",{remaining:mins*60,msgs:[{who:"s",text:(fill(T("opener"),{n:name,t:t})+q+T("openerEnd")).replace(" !","!")}],count:{},topics:[S.topic],warned5:mins*60<=300,warned1:false,distress:false,typing:false,ended:false,rating:0});
  chatTimer=setInterval(chatTick,1000);
}
function chatTick(){
  var d=overlay.data; if(overlay.type!=="chat"||d.ended)return;
  d.remaining--;
  if(d.remaining<=300&&!d.warned5){d.warned5=true;if(!d.distress)d.msgs.push({who:"sys",kind:"warn5"});renderChatBody();}
  if(d.remaining<=60&&!d.warned1){d.warned1=true;if(!d.distress)d.msgs.push({who:"sys",kind:"warn1"});renderChatBody();}
  if(d.remaining<=0){endChat();return;}
  var tm=$("chatTimer"); if(tm){tm.textContent=fmt(d.remaining);tm.classList.toggle("low",d.remaining<=300);}
}
function endChat(){var d=overlay.data;d.ended=true;stopChatTimer();overlay.render();}
function detectTopic(text){
  var x=text.toLowerCase();
  for(var i=0;i<DISTRESS.length;i++){if(x.indexOf(DISTRESS[i])>-1)return "distress";}
  for(var k in KEYWORDS){for(var j=0;j<KEYWORDS[k].length;j++){if(x.indexOf(KEYWORDS[k][j])>-1)return k;}}
  return null;
}
var HL_WORDS=/\b(kab|kya|hai|hain|mera|meri|mujhe|nahi|nhi|shaadi|shadi|naukri|paisa|kaise|kyun|batao|bataiye|aur|mein|mei|ho|hoga|hogi|karna|chahiye|rishta)\b/i;
function detectLang(t){
  if(/[\u0900-\u097F]/.test(t))return "hi";
  if(HL_WORDS.test(t))return "hl";
  if(/^[\x00-\x7F\s]+$/.test(t)&&/\b(the|my|will|when|what|how|is|are|should|can|job|marriage|money)\b/i.test(t))return "en";
  return S.lang;
}
function reply(text){
  var __prev=S.lang; S.lang=detectLang(text); try{ reply2(text); }finally{ S.lang=__prev; }
}
function reply2(text){
  var d=overlay.data,topic=detectTopic(text),out;
  if(topic==="distress"){d.distress=true;out=T("distress");}
  else{
    if(!topic){topic=d.count[d.lastTopic]!=null&&d.count[d.lastTopic]<2?d.lastTopic:null;}
    if(!topic&&Object.keys(d.count).length===0)topic=S.topic;
    if(!topic){out=T("fallback");}
    else{var c=d.count[topic]||0;out=c<2?T("replies")[topic][c]:T("followup");d.count[topic]=c+1;d.lastTopic=topic;if(d.topics.indexOf(topic)<0)d.topics.push(topic);}
  }
  d.typing=true;renderChatBody();
  setTimeout(function(){if(overlay.type!=="chat")return;d.typing=false;d.msgs.push({who:"s",text:out});renderChatBody();},1100+Math.min(out.length*8,1400));
}

  renderChatBody();

/* reviews carousel: endless loop (cards rendered twice, position wraps at the halfway point) */
(function(){
  var track=$("revTrack"),paused=false,pos=0,target=null,speed=0.45;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function half(){return track.scrollWidth/2;}
  function wrap(){var h=half();if(h<=0)return;while(pos>=h)pos-=h;while(pos<0)pos+=h;}
  function step(){var el=track.firstElementChild;return (el?el.offsetWidth:320)+18;}
  function nudge(dir){pos=track.scrollLeft;target=pos+dir*step();}
  function frame(){
    if(target!==null){var diff=target-pos;if(Math.abs(diff)<1){pos=target;target=null;}else pos+=diff*0.12;}
    else if(!paused&&!reduce&&!document.hidden)pos+=speed;
    else pos=track.scrollLeft;
    var h=half();
    if(target!==null){if(pos>=h){pos-=h;target-=h;}else if(pos<0){pos+=h;target+=h;}}
    else wrap();
    track.scrollLeft=pos;
    requestAnimationFrame(frame);
  }
  $("revPrev").addEventListener("click",function(){nudge(-1);});
  $("revNext").addEventListener("click",function(){nudge(1);});
  ["mouseenter","focusin","touchstart","pointerdown"].forEach(function(ev){track.addEventListener(ev,function(){paused=true;},{passive:true});});
  ["mouseleave","focusout","touchend"].forEach(function(ev){track.addEventListener(ev,function(){paused=false;pos=track.scrollLeft;},{passive:true});});
  track.addEventListener("scroll",function(){if(paused&&target===null){pos=track.scrollLeft;var h=half();if(pos>=h-2||pos<=0){wrap();if(pos<=0)pos+=h;track.scrollLeft=pos;}}},{passive:true});
  requestAnimationFrame(frame);
})();

function handleSvc(s){
  if(s==="muhuratAsk")s="chat";
  if(s==="chat"||s==="call"){S.mode=s;renderForm();if(S.snap)renderResult();go("kundli");return;}
  if(TOPICS.indexOf(s)>-1){S.topic=s;renderForm();if(S.snap){$("kForm").hidden=false;$("kResult").hidden=true;}go("kundli");return;}
  if(s==="kundli"){go("kundli");return;}
  if(s==="milan"){go("milan");setTimeout(function(){$("mBoyName").focus({preventScroll:true});},500);return;}
  if(s==="rashifal"){go("rashifal");return;}
  if(s==="panchang"){go("panchangBox");return;}
  if(s==="wallet"){openLayer("wallet",{});return;}
  toast(T("demoSoon"));
}

var milan={score:null};
function renderMilanRes(){
  var box=$("mRes"); if(!box)return;
  if(milan.score==null){box.hidden=true;return;}
  var band=milan.score<18?0:milan.score<24?1:milan.score<30?2:3;
  var who=milan.a&&milan.b?fill(T("milanBy"),{a:milan.a,b:milan.b}):"";
  box.innerHTML='<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;border-color:var(--accent)">'+(who?'<b>'+esc(who)+'</b>':'')+(milan.bd?'<div class="kv small"><div><span>'+esc(T("boyHead"))+'</span><b>'+esc([milan.bd[0],milan.bd[1]||T("timeNA"),milan.bd[2]].join(" · "))+'</b></div><div><span>'+esc(T("girlHead"))+'</span><b>'+esc([milan.gd[0],milan.gd[1]||T("timeNA"),milan.gd[2]].join(" · "))+'</b></div></div>':'')+'<div class="score"><b>'+milan.score+'</b><span class="muted">/ 36</span></div><div class="bar" role="img" aria-label="'+milan.score+'/36"><i style="width:'+Math.round(milan.score/36*100)+'%"></i></div><p>'+esc(T("milanBands")[band])+'</p><span class="tag-demo">'+esc(milan.live?(S.lang==="en"?"Computed by the chart engine (Ashtakoota, 36 points)."+(milan.live.approx_time?" Birth time missing, so noon was assumed.":""):S.lang==="hi"?"चार्ट इंजन से गणना (अष्टकूट, 36 अंक)।":"Chart engine se ganana (Ashtakoota, 36 ank)."+(milan.live.approx_time?" Janm samay nahi diya, isliye dopahar maana gaya.":"")):T("milanDemo"))+'</span><a href="#kundli" class="btn btn-dark">'+esc(T("milanCta"))+'</a></div>';
  box.hidden=false;
}
$("milanInline").addEventListener("submit",function(e){
  e.preventDefault();
  var b=$("mBoy2").value,g=$("mGirl2").value,bp=$("mBoyPlace").value.trim(),gp=$("mGirlPlace").value.trim(),bt=$("mBoyTime").value,gt=$("mGirlTime").value,err=$("mErr");
  if(!b||!g||!bp||!gp){err.textContent=T("milanErr2");err.hidden=false;milan.score=null;renderMilanRes();return;}
  err.hidden=true;
  var sub=$("milanInline").querySelector('button[type="submit"]'); if(sub)sub.disabled=true;
  var done=function(){if(sub)sub.disabled=false;renderMilanRes();};
  apiJson("/api/milan",{boy:{date:b,time:bt||null,place:bp},girl:{date:g,time:gt||null,place:gp}}).then(function(d){
    milan={score:Math.round(d.total*10)/10,live:d,a:$("mBoyName").value.trim(),b:$("mGirlName").value.trim(),bd:[b,bt,bp],gd:[g,gt,gp]};track("milan_done");done();
  }).catch(function(){scripted();});
  function scripted(){
  var s=(b+g+bt+gt).replace(/\D/g,"").split("").reduce(function(a,c){return a+Number(c);},0)+bp.length+gp.length;
  milan={score:14+(s%21),a:$("mBoyName").value.trim(),b:$("mGirlName").value.trim(),bd:[b,bt,bp],gd:[g,gt,gp]};
  done();}
});
